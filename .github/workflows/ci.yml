name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: node --test Tests/*.test.mjs
  macos:
    strategy:
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: zsh build.sh
      - run: '"dist/Codex Switch.app/Contents/Resources/Runtime/node" --test Tests/*.test.mjs'
      - run: zsh Tools/test-localization.sh
      - if: matrix.os == 'macos-26'
        run: ditto -c -k --norsrc --noextattr --keepParent "dist/Codex Switch.app" dist/Codex-Switch-macOS-arm64.zip
      - if: matrix.os == 'macos-26'
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Switch-macOS-arm64
          path: dist/Codex-Switch-macOS-arm64.zip
          retention-days: 7
