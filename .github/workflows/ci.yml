name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: node --test Tests/*.test.mjs
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: zsh build.sh
      - run: '"dist/Codex Switch.app/Contents/Resources/Runtime/node" --test Tests/*.test.mjs'
